# Mini App (webapp/) → ветка gh-pages → GitHub Pages («Deploy from a branch»). Токену workflow
# не хватает прав включить Pages через API (configure-pages enablement → «Resource not
# accessible by integration»), а ветку gh-pages GitHub публикует сам.
name: Publish Mini App (gh-pages)

on:
  push:
    branches: [main]
    paths: ["webapp/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./webapp
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
